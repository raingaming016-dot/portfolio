{% extends "base.html" %}
{% block content %}
<a href="/" class="back-btn">← Back to Home</a>
<div class="card">
    <h1>Area of a Circle</h1>
    <p>Calculate the area of a circle by entering its radius.</p>
    <div class="formula" style="background: #d8c39b; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; color: #8b3024; margin: 20px 0;">A = πr²</div>
    <form method="POST">
        <label>Radius</label>
        <input type="number" name="radius" step="any" placeholder="Enter radius" required>
        <button type="submit">Calculate Area</button>
    </form>
    {% if result %}
    <div class="result"><div class="result-title">Calculated Area</div><p>{{ "%.2f"|format(result) }} square units</p></div>
    {% endif %}
</div>
{% endblock %}
